name: Update Readme

on:
  push:
    # Branch-scoped deliberately. An unfiltered `push:` fires on every branch and every
    # tag. On a tag it checks out a detached HEAD, so the commit step's bare `git push`
    # has no upstream to push to and the run fails -- which would happen every time the
    # `release` tag is moved. On a feature branch it regenerates a file that only matters
    # on main and commits it there, which is how the profile README came to conflict
    # between main and a pull request branch that never touched it.
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# A newer run regenerates from a newer main, so the one in progress has nothing left to add.
# Cancelling it shows the run as cancelled rather than failed when merges land in a burst.
# See ktsu-dev/.github#55.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-readme:
    name: Update Readme
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install KtsuBuild
        run: dotnet tool install ktsu.KtsuBuild.Tool --tool-path ./.ktsubuild

      # The tool reads the GitHub API through the gh CLI, which is preinstalled on the runner.
      #
      # The Status column keys on `ci.yml`, the caller every repository uses to reach the shared
      # pipeline. `--fallback-workflow dotnet.yml` keeps a status showing for the repositories that
      # have not been moved over yet, and logs a warning naming each one, so the flag comes off by
      # itself once the warnings stop. It is accepted by the published tool as well, where it is
      # simply never consulted, so this runs correctly whichever version is installed.
      - name: Generate Readme
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          ./.ktsubuild/ktsubuild profile readme
          --org ktsu-dev
          --exclude Sdk
          --fallback-workflow dotnet.yml
          --template ./profile/README.template
          --output ./profile/README.md

      - name: Check for Changes
        id: check_changes
        run: |
          git add ./profile/README.md
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      # Generation takes about ten minutes, and a commit that does not start this workflow (a
      # `[skip ci]` bot commit, say) can land on the branch meanwhile. Nothing cancels this run
      # then, so the push has to move onto the new tip rather than be rejected. Only
      # profile/README.md changes here, and on a clash the README this run just generated wins.
      # See ktsu-dev/.github#55.
      - name: Commit Changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.email "actions@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "[skip ci][bot] Update README.md"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/$GITHUB_REF_NAME"
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          done
          echo "::error::Could not push the README after 3 attempts"
          exit 1
