name: Update Readme

on:
  push:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  update-readme:
    name: Update Readme
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install KtsuBuild
        run: dotnet tool install ktsu.KtsuBuild.Tool --tool-path ./.ktsubuild

      # The tool reads the GitHub API through the gh CLI, which is preinstalled on the runner.
      - name: Generate Readme
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          ./.ktsubuild/ktsubuild profile readme
          --org ktsu-dev
          --exclude Sdk
          --template ./profile/README.template
          --output ./profile/README.md

      - name: Check for Changes
        id: check_changes
        run: |
          git add ./profile/README.md
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit Changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.email "actions@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "[skip ci][bot] Update README.md"
          git push
